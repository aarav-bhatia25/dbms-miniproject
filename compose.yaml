services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caneflow_simple
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - caneflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caneflow_simple"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  caneflow_pgdata:
